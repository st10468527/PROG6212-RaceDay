name: Validate Repo Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check required files exist in /docs
        run: |
          required_files=(
            "docs/ERD.png"
            "docs/API-Endpoint-Plan.md"
            "docs/RaceDay_Schema.sql"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              missing=1
            else
              echo "Found: $file"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
